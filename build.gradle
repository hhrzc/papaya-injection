plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.hhrzc'
version = '0.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    junitBomVersion = '5.10.0'
    springBootVersion = '3.3.2'
    playwrightVersion = '1.55.0'
    mokitoVersion = '5.12.0'
    seleniumVersion = '4.41.0'
    springVersion = '6.1.18'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':ppi-core')
    implementation project(':ppi-playwright-java')
    implementation project(':ppi-playwright-spring')
    compileOnly "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:${mokitoVersion}"
    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'Papaya Injection'
        description = 'A Java library for QA test automation with Playwright integration.'
        inceptionYear = '2026'
        url = 'https://github.com/hhrzc/papaya-injection'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'hhrzc'
                name = 'Valentyn'
                url = 'https://github.com/hhrzc'
            }
        }

        scm {
            url = 'https://github.com/hhrzc/papaya-injection'
            connection = 'scm:git:git://github.com/hhrzc/papaya-injection.git'
            developerConnection = 'scm:git:ssh://git@github.com/hhrzc/papaya-injection.git'
        }
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}