plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false   // available to modules, NOT applied to root
    id 'com.github.spotbugs' version '6.5.13' apply false
}

group = 'io.github.hhrzc'
version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    junitBomVersion = '5.10.0'
    springBootVersion = '3.3.2'
    playwrightVersion = '1.55.0'
    mockitoVersion = '5.12.0'
    seleniumVersion = '4.41.0'
    springVersion = '6.1.18'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':ppi-core')
    implementation project(':ppi-playwright-java')
    implementation project(':ppi-playwright-spring')
    compileOnly "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Environment variables for StageEnvironmentTest.
    environment 'PPI_TEST_ENV_STAGE', 'prod'        // env style of the name "ppi.test.env.stage"
    environment 'ppi.test.exact.stage', 'dev'      // exact name (rare, but supported)
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    group = 'io.github.hhrzc'
    version = rootProject.version

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom {
            inceptionYear = '2026'
            url = 'https://github.com/hhrzc/papaya-injection'
            licenses { license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'https://opensource.org/licenses/MIT'
            } }
            developers { developer {
                id = 'hhrzc'; name = 'Valentyn'; url = 'https://github.com/hhrzc'
            } }
            scm {
                url = 'https://github.com/hhrzc/papaya-injection'
                connection = 'scm:git:git://github.com/hhrzc/papaya-injection.git'
                developerConnection = 'scm:git:ssh://git@github.com/hhrzc/papaya-injection.git'
            }
        }
    }

    // ---------- PMD: code smells in the source ----------
    pmd {
        toolVersion = '7.28.0'
        consoleOutput = true          // print problems in the build output
        ignoreFailures = true         // start with reports only, don't break the build yet
        ruleSets = []                 // turn off Gradle's default rule list...
        ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')   // ...and use ours
    }

    // ---------- SpotBugs: real bugs in the bytecode ----------
    spotbugs {
        ignoreFailures = true         // reports only, for now
        effort = 'MAX'
        reportLevel = 'MEDIUM'
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html { required = true }  // a readable HTML report
        }
    }

    // analyze the library code only, not the tests
    tasks.named('pmdTest') { enabled = false }
    tasks.named('spotbugsTest') { enabled = false }
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}