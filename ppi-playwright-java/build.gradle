plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.hhrzc'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':ppi-core')
    compileOnly "com.microsoft.playwright:playwright:${playwrightVersion}"
    api project(":common-invocation-handler")
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'PPI Playwright Java'
        description = 'Playwright integration for the Papaya Injection test automation library (plain Java, no Spring).'
        inceptionYear = '2026'
        url = 'https://github.com/hhrzc/papaya-injection'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'hhrzc'
                name = 'Valentyn'
                url = 'https://github.com/hhrzc'
            }
        }

        scm {
            url = 'https://github.com/hhrzc/papaya-injection'
            connection = 'scm:git:git://github.com/hhrzc/papaya-injection.git'
            developerConnection = 'scm:git:ssh://git@github.com/hhrzc/papaya-injection.git'
        }
    }
}