plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.hhrzc.papaya'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "ppi-playwright-java"
        }
    }
    repositories {
        maven {
            url "https://gitlab.com/api/v4/projects/80221747/packages/maven"
            credentials(HttpHeaderCredentials) {
                name = "Deploy-Token"
                value = System.getenv("PAPAYA_TOKEN")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':ppi-core')
    compileOnly "com.microsoft.playwright:playwright:${playwrightVersion}"
    api project(":common-invocation-handler")
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}