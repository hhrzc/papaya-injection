plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.hhrzc'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':ppi-core')
    compileOnly "org.springframework:spring-context:${springVersion}"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = 'PPI Core Spring'
        description = 'Spring integration support for the PPI Core module of the Papaya Injection test automation library.'
        inceptionYear = '2026'
        url = 'https://github.com/hhrzc/papaya-injection'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'hhrzc'
                name = 'Valentyn'
                url = 'https://github.com/hhrzc'
            }
        }

        scm {
            url = 'https://github.com/hhrzc/papaya-injection'
            connection = 'scm:git:git://github.com/hhrzc/papaya-injection.git'
            developerConnection = 'scm:git:ssh://git@github.com/hhrzc/papaya-injection.git'
        }
    }
}