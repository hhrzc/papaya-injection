plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.hhrzc'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //api
    api project(":ppi-playwright-java")
    api project(":ppi-core-spring")
    api project(":common-invocation-handler")
    //core
    compileOnly "org.springframework:spring-context:${springVersion}"
    compileOnly "com.microsoft.playwright:playwright:${playwrightVersion}"
    //test
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    pom {
        name = 'PPI Playwright Spring'
        description = 'Spring integration for Playwright support in the Papaya Injection test automation library.'
    }
}